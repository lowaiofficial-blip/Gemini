<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini — Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <script type="module" src="favicon.js"></script>
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="admin-header__left">
      <button id="backBtn" class="admin-back hide"><i class='bx bx-arrow-back'></i></button>
      <h1 id="adminTitle">Gemini Admin</h1>
    </div>
    <button id="adminLogout" class="admin-logout">Çıkış</button>
  </header>

  <main class="admin-main">

    <div id="viewUsers" class="admin-view">
      <div class="admin-favicon-box">
        <div class="admin-favicon-current">
          <img id="faviconPreview" src="https://i.imgur.com/teeb0yO.png" alt="Favicon" />
        </div>
        <div class="admin-favicon-info">
          <strong>Favicon</strong>
          <span>Site ikonunu değiştir</span>
        </div>
        <label class="admin-favicon-btn">
          <i class='bx bx-upload'></i> Yükle
          <input type="file" id="faviconInput" accept="image/*" hidden />
        </label>
      </div>

      <input type="text" id="filterUser" class="admin-search" placeholder="Email ile ara" />
      <div class="admin-stats">
        <div class="admin-stat"><span id="statUsers">0</span><label>Kullanıcı</label></div>
        <div class="admin-stat"><span id="statChats">0</span><label>Sohbet</label></div>
        <div class="admin-stat"><span id="statMessages">0</span><label>Mesaj</label></div>
      </div>
      <div id="userList" class="admin-list"></div>
    </div>

    <div id="viewChats" class="admin-view hide">
      <input type="text" id="filterText" class="admin-search" placeholder="Başlıkta ara" />
      <div id="chatList" class="admin-list"></div>
    </div>

    <div id="viewMessages" class="admin-view hide">
      <div id="messageList" class="admin-list"></div>
    </div>

  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
